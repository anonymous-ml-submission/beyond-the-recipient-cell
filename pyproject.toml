[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakage-vso"
version = "0.3.0"
description = "Leakage-aware virtual spatial omics: visible structured label-noise audits and source-intervention controls"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "tifffile>=2024.2.12",
  "zarr>=2.17,<3",
  "imagecodecs>=2024.1.1",
  "pillow>=10.2",
  "anndata>=0.10.5",
  "scanpy>=1.10",
  "h5py>=3.10",
  "pyarrow>=15",
  "huggingface_hub>=0.24",
  "requests>=2.31",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
  "shapely>=2.0",
  "scikit-image>=0.23",
]

[project.optional-dependencies]
openslide = ["openslide-python>=1.3"]
timm = ["timm>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["leakage_vso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
